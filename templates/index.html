<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoldSMC Pro Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0b10; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
   .no-scrollbar::-webkit-scrollbar { display: none; }
   .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    * { box-sizing: border-box; }
  </style>
</head>
<body class="text-white w-full max-w-[1400px] mx-auto px-2 md:px-4 pb-8">

  <div class="bg-[#111119] border border-white/10 rounded-t-2xl mt-2 overflow-hidden">
    <div class="px-3 py-2 flex flex-wrap items-center justify-between text-xs font-mono gap-2 border-b border-white/10">
      <div class="flex items-center gap-3 overflow-x-auto no-scrollbar py-1">
        <span class="text-white/40 uppercase font-bold text-[10px] whitespace-nowrap"><i class="fa-solid fa-globe text-yellow-400 mr-1"></i> Sessions:</span>
        <div id="sessionsContainer" class="flex items-center gap-2"></div>
      </div>
      <div id="marketStatusClock" class="text-yellow-400 font-bold bg-white/5 px-2.5 py-0.5 rounded-full border border-white/10 whitespace-nowrap">00:00:00 UTC</div>
    </div>
    <div id="newsAlertBanner" class="hidden bg-red-500/15 border-b border-red-500/30 px-3 py-2 text-xs font-mono flex items-center justify-between text-red-300 gap-2">
      <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-ping shrink-0"></span><span id="newsAlertText"></span></div>
      <button onclick="toggleNewsModal(true)" class="bg-red-500/20 hover:bg-red-500/30 text-red-200 px-2.5 py-1 rounded text-[11px] font-bold">View</button>
    </div>
    <div class="flex flex-col md:flex-row items-center justify-between gap-3 px-3 py-4 bg-[#111119]/55">
      <div class="flex items-center gap-2">
        <h1 class="font-black text-xl tracking-wider">GOLD<span class="text-yellow-400">SMC</span></h1>
        <span class="text-[10px] bg-yellow-400/10 text-yellow-400 border border-yellow-400/30 px-2 py-0.5 rounded-full font-mono font-bold">PRO TERMINAL</span>
      </div>
      <div class="flex bg-white/5 p-1 rounded-full border border-white/10 text-xs font-mono overflow-x-auto max-w-full">
        <button onclick="changeTimeframe('1m', this)" class="tf-btn bg-yellow-400 text-black font-bold px-3 py-1 rounded-full transition whitespace-nowrap">1M</button>
        <button onclick="changeTimeframe('5m', this)" class="tf-btn px-3 py-1 rounded-full text-white/70 hover:text-yellow-400 transition whitespace-nowrap">5M</button>
        <button onclick="changeTimeframe('15m', this)" class="tf-btn px-3 py-1 rounded-full text-white/70 hover:text-yellow-400 transition whitespace-nowrap">15M</button>
        <button onclick="changeTimeframe('30m', this)" class="tf-btn px-3 py-1 rounded-full text-white/70 hover:text-yellow-400 transition whitespace-nowrap">30M</button>
        <button onclick="changeTimeframe('1h', this)" class="tf-btn px-3 py-1 rounded-full text-white/70 hover:text-yellow-400 transition whitespace-nowrap">1H</button>
        <button onclick="changeTimeframe('1d', this)" class="tf-btn px-3 py-1 rounded-full text-white/70 hover:text-yellow-400 transition whitespace-nowrap">1D</button>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportChartOnly()" class="bg-yellow-400/15 hover:bg-yellow-400/25 border border-yellow-400/30 text-yellow-400 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5"><i class="fa-solid fa-camera"></i> Save Chart</button>
        <button onclick="toggleNewsModal(true)" class="bg-white/10 hover:bg-white/20 border border-white/10 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5"><i class="fa-regular fa-newspaper text-yellow-400"></i> News</button>
      </div>
    </div>
  </div>

  <div class="mt-3 bg-[#111119] border border-white/5 rounded-2xl p-3 flex flex-col md:flex-row items-center justify-between gap-2 text-xs font-mono">
    <span class="text-white/40 uppercase font-bold text-[11px] whitespace-nowrap"><i class="fa-solid fa-layer-group text-yellow-400 mr-1"></i> MTF Matrix:</span>
    <div id="mtfMatrixContainer" class="flex flex-wrap items-center gap-2 w-full"></div>
  </div>

  <div class="flex flex-col lg:flex-row items-center justify-between gap-3 px-3 py-3 mt-2 bg-[#111119] border border-white/5 rounded-xl text-xs">
    <div class="flex flex-wrap items-center gap-3 font-mono text-[11px] text-white/80">
      <span class="text-white/40 uppercase font-bold mr-1">SMC LAYERS:</span>
      <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="toggle-ob" checked onchange="requestAnimationFrame(renderSMCZonesCanvas)" class="accent-yellow-400"> OB</label>
      <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="toggle-fvg" checked onchange="requestAnimationFrame(renderSMCZonesCanvas)" class="accent-yellow-400"> FVG</label>
      <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="toggle-bos" checked onchange="requestAnimationFrame(renderSMCZonesCanvas)" class="accent-yellow-400"> CHoCH/BOS</label>
      <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="toggle-liq" checked onchange="requestAnimationFrame(renderSMCZonesCanvas)" class="accent-yellow-400"> Liquidity</label>
      <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="toggle-pd" checked onchange="requestAnimationFrame(renderSMCZonesCanvas)" class="accent-yellow-400"> Premium/Discount</label>
    </div>
    <div class="font-mono text-yellow-400 flex items-center gap-1 text-[11px]"><i class="fa-regular fa-clock"></i> Close: <span id="candleCountdown">--:--</span></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mt-3">
    <div id="chartContainerBlock" class="lg:col-span-3 bg-[#111119] border border-white/5 rounded-[24px] p-3 relative overflow-hidden flex flex-col">
      <div class="flex items-center justify-between px-2 pb-2">
        <div class="text-xs font-bold text-white/70 uppercase tracking-widest flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> XAU/USD</div>
        <div id="tfIndicatorBadge" class="text-[11px] text-yellow-400 font-mono bg-yellow-400/10 px-2.5 py-0.5 rounded-full">1M SMC Canvas</div>
      </div>
      <div class="relative w-full h-[400px] sm:h-[550px] lg:h-[65vh]">
        <div id="chartLoadingOverlay" class="absolute inset-0 bg-[#111119]/80 z-30 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity"><div class="w-8 h-8 rounded-full border-2 border-yellow-400 border-t-transparent animate-spin mb-2"></div><div class="text-xs font-mono text-yellow-400 font-bold uppercase">Switching...</div></div>
        <div id="chart" class="w-full h-full rounded-xl overflow-hidden"></div>
        <canvas id="drawCanvas" class="absolute left-0 top-0 w-full h-full pointer-events-none z-10"></canvas>
      </div>
    </div>
    <div class="flex flex-col gap-4"><div id="info" class="bg-[#111119] border border-white/5 rounded-[24px] p-4"><div class="text-xs text-white/40 uppercase font-mono flex items-center gap-2"><span class="w-3 h-3 rounded-full border-2 border-yellow-400 border-t-transparent animate-spin"></span> Loading...</div></div></div>
  </div>

  <footer class="mt-6 bg-[#111119] border border-white/5 rounded-[24px] p-4 text-xs text-white/60">© 2026 GoldSMC - SMC Engine Only</footer>

  <div id="newsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#111119] border border-white/10 w-full max-w-2xl rounded-[24px] p-5 flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-3 border-b border-white/10"><h3 class="font-bold text-sm uppercase">Economic Calendar</h3><button onclick="toggleNewsModal(false)" class="text-white/40 hover:text-white text-lg">&times;</button></div>
      <div id="newsModalList" class="overflow-y-auto flex-1 py-4 space-y-2"></div>
    </div>
  </div>

<script>
let chart, candleSeries, currentTF='1m', currentData=null, activePriceLines=[], isInitialLoad=true, cachedNewsEvents=[], tfDataCache={}, currentFetchController=null;

function isGoldMarketClosedNow(){const n=new Date(),d=n.getUTCDay(),h=n.getUTCHours();if(d===6)return true;if(d===5&&h>=22)return true;if(d===0&&h<22)return true;return false;}
function updateMarketSessionsAndClock(){
  const now=new Date(),utcDay=now.getUTCDay(),utcHour=now.getUTCHours();
  let isWeekend=false,target=new Date(now);
  if(utcDay===6){isWeekend=true;target.setUTCDate(now.getUTCDate()+(7-utcDay));target.setUTCHours(22,0,0,0);}
  else if(utcDay===5&&utcHour>=22){isWeekend=true;target.setUTCDate(now.getUTCDate()+2);target.setUTCHours(22,0,0,0);}
  else if(utcDay===0&&utcHour<22){isWeekend=true;target.setUTCHours(22,0,0,0);}
  const clock=document.getElementById('marketStatusClock');
  if(isWeekend){let diff=target-now,secs=Math.floor(diff/1000),d=Math.floor(secs/86400),h=Math.floor(secs%86400/3600),m=Math.floor(secs%3600/60),s=secs%60;clock.innerHTML=`<span class="text-red-400">Closed (Opens in ${d>0?d+'d ':''}${h}h ${m}m ${s}s)</span>`;}
  else clock.innerText=now.toISOString().substring(11,19)+" UTC";
  const sessions=[{name:"Sydney",open:22,close:7},{name:"Tokyo",open:0,close:9},{name:"London",open:8,close:17},{name:"NY",open:13,close:22}];
  document.getElementById('sessionsContainer').innerHTML=sessions.map(s=>{
    let open=!isWeekend&&(s.open<s.close?(utcHour>=s.open&&utcHour<s.close):(utcHour>=s.open||utcHour<s.close));
    return `<span class="flex items-center gap-1">${s.name}: ${open?'<span class="bg-green-500/20 text-green-400 border border-green-500/30 px-1.5 py-0.5 rounded font-bold">OPEN</span>':'<span class="bg-white/5 text-white/40 border border-white/10 px-1.5 py-0.5 rounded">CLOSED</span>'}</span>`;
  }).join('<span class="text-white/20">•</span>');
}
function checkUpcomingNewsAlert(){if(!cachedNewsEvents.length){document.getElementById('newsAlertBanner').classList.add('hidden');return;}let now=new Date(),up=cachedNewsEvents.find(e=>{if(!e.date)return false;let t=new Date(e.date),d=t-now;return d>0&&d<=30*60*1000;});let b=document.getElementById('newsAlertBanner');if(up){let d=new Date(up.date)-now,m=Math.floor(d/60000),s=Math.floor(d%60000/1000);document.getElementById('newsAlertText').innerHTML=`High Impact ${up.title} in <span class="text-white font-bold">${m}m ${s}s</span>`;b.classList.remove('hidden');}else b.classList.add('hidden');}
setInterval(()=>{let now=new Date();updateMarketSessionsAndClock();checkUpcomingNewsAlert();if(isGoldMarketClosedNow()){document.getElementById('candleCountdown').innerText="CLOSED";return;}let tfM=currentTF==='1m'?1:currentTF==='5m'?5:currentTF==='15m'?15:currentTF==='30m'?30:currentTF==='1h'?60:1440,left=(tfM*60)-((now.getMinutes()%tfM)*60+now.getSeconds());if(currentTF==='1d'){let tot=now.getUTCHours()*60+now.getUTCMinutes();left=(1440*60)-tot*60-now.getUTCSeconds();}let m=Math.floor(left/60),s=left%60;document.getElementById('candleCountdown').innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);
function toggleNewsModal(o){document.getElementById('newsModal').classList.toggle('hidden',!o);if(o)loadNewsEvents();}
function changeTimeframe(tf,btn){if(currentTF===tf&&!isInitialLoad)return;currentTF=tf;isInitialLoad=true;if(activePriceLines.length&&candleSeries){activePriceLines.forEach(l=>{try{candleSeries.removePriceLine(l);}catch{}});activePriceLines=[];candleSeries.setMarkers([]);}document.querySelectorAll('.tf-btn').forEach(b=>{b.classList.remove('bg-yellow-400','text-black','font-bold');b.classList.add('text-white/70');});if(btn){btn.classList.add('bg-yellow-400','text-black','font-bold');btn.classList.remove('text-white/70');}document.getElementById('tfIndicatorBadge').innerText=`${tf.toUpperCase()} SMC Canvas`;let ov=document.getElementById('chartLoadingOverlay');ov.classList.remove('opacity-0','pointer-events-none');ov.classList.add('opacity-100');loadChartHistory();}
function exportChartOnly(){let b=document.getElementById('chartContainerBlock');html2canvas(b,{backgroundColor:'#0b0b10',scale:2}).then(c=>{let l=document.createElement('a');l.download=`GoldSMC_${currentTF}_${new Date().toISOString().slice(0,10)}.png`;l.href=c.toDataURL('image/png');l.click();});}
async function loadNewsEvents(){
  try{let r=await fetch('/api/news');let data=await r.json();cachedNewsEvents=data;let cont=document.getElementById('newsModalList');
  if(!data.length) cont.innerHTML='<div class="text-xs text-center text-white/40 font-mono py-4">No high-impact USD news this week</div>';
  else cont.innerHTML=data.map(ev=>`<div class="bg-white/5 border border-white/10 rounded-xl p-3 flex justify-between"><div><div class="font-bold text-xs">${ev.title}</div><div class="text-[11px] text-white/40">${ev.date||''} • ${ev.country}</div></div><span class="text-[10px] bg-red-500/20 text-red-300 border border-red-500/30 px-2 py-0.5 rounded-full h-fit">${ev.impact}</span></div>`).join('');
  }catch{ document.getElementById('newsModalList').innerHTML='<div class="text-xs text-center text-white/40">News unavailable</div>'; }
}
async function loadChartHistory(){
  if(currentFetchController) currentFetchController.abort();
  currentFetchController=new AbortController();
  try{let r=await fetch(`/api/analysis?tf=${currentTF}`,{signal:currentFetchController.signal});let d=await r.json();tfDataCache[currentTF]=d;processChartData(d);}catch(e){if(e.name!=='AbortError') console.error(e);}finally{let ov=document.getElementById('chartLoadingOverlay');ov.classList.remove('opacity-100');ov.classList.add('opacity-0','pointer-events-none');}
}
function processChartData(d){
  currentData=d;
  let color=d.score>0?'text-green-400':d.score<0?'text-red-400':'text-yellow-400';
  if(d.mtf_matrix){
    document.getElementById('mtfMatrixContainer').innerHTML=Object.entries(d.mtf_matrix).map(([tf,bias])=>{
      let cls=bias==='BULLISH'?'bg-green-500/20 text-green-400 border-green-500/30':bias==='BEARISH'?'bg-red-500/20 text-red-400 border-red-500/30':'bg-yellow-500/20 text-yellow-400 border-yellow-500/30';
      return `<span class="px-2 py-0.5 rounded-full border ${cls} font-bold">${tf.toUpperCase()}: ${bias}</span>`;
    }).join('');
  }
  let pdBadge=d.pd_zones?.current_zone==='DISCOUNT'?'<span class="text-green-400 font-bold">DISCOUNT</span>':'<span class="text-red-400 font-bold">PREMIUM</span>';
  document.getElementById('info').innerHTML=`
    <div class="flex justify-between"><div class="text-[10px] text-white/40 uppercase font-mono">Signal (${currentTF.toUpperCase()})</div><div class="text-[10px] bg-white/10 px-2.5 py-1 rounded-full font-mono">RSI ${d.rsi?.toFixed(1)||'50.0'}</div></div>
    <div class="mt-2 text-2xl font-black ${color}">${d.signal}</div>
    <div class="mt-1 text-xs font-mono text-white/60">$${d.price?.toFixed(2)||'0.00'} ${d.market_open===false?'<span class="text-red-400">(CLOSED)</span>':''} <span class="text-white/30 text-[10px]">offset ${d.offset}</span></div>
    <div class="mt-3 bg-white/5 border border-white/10 rounded-xl p-2.5 flex justify-between text-xs"><span class="text-white/50">P/D Zone:</span>${pdBadge}</div>
    <div class="mt-3 bg-gradient-to-br from-yellow-400/10 to-transparent border border-yellow-400/20 rounded-[16px] p-3"><div class="text-[10px] text-yellow-400 font-bold uppercase mb-1">Reason</div><div class="text-[11px] leading-relaxed text-white/80">${(d.reasons||[]).join(' • ')||'Waiting for structure'}</div></div>
    <div class="mt-3 grid grid-cols-2 gap-2">
      <div class="bg-green-500/10 border border-green-500/20 rounded-xl p-2.5"><div class="text-[9px] text-green-300 uppercase font-bold">Demand Low</div><div class="text-xs font-bold text-green-400">$${d.pd_zones?.swing_low?.toFixed(2)||'0.00'}</div></div>
      <div class="bg-red-500/10 border border-red-500/20 rounded-xl p-2.5"><div class="text-[9px] text-red-300 uppercase font-bold">Supply High</div><div class="text-xs font-bold text-red-400">$${d.pd_zones?.swing_high?.toFixed(2)||'0.00'}</div></div>
    </div>
    <div class="mt-3 flex flex-wrap gap-1">${(d.reasons||[]).map(x=>`<span class='text-[10px] bg-white/[0.06] border border-white/5 px-2 py-0.5 rounded-full text-white/70'>• ${x}</span>`).join('')}</div>
  `;
  const container=document.getElementById('chart');
  if(!chart){
    chart=LightweightCharts.createChart(container,{width:container.clientWidth,height:container.clientHeight,layout:{background:{color:'#111119'},textColor:'#888'},grid:{vertLines:{color:'#1a1a23'},horzLines:{color:'#1a1a23'}},timeScale:{timeVisible:true,secondsVisible:false}});
    candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff4444',borderVisible:false,wickUpColor:'#00ff88',wickDownColor:'#ff4444'});
    chart.timeScale().subscribeVisibleLogicalRangeChange(()=>requestAnimationFrame(renderSMCZonesCanvas));
    window.addEventListener('resize',()=>{if(chart&&container){chart.applyOptions({width:container.clientWidth,height:container.clientHeight});requestAnimationFrame(renderSMCZonesCanvas);}});
  }
  if(candleSeries&&d.candles?.length){candleSeries.setData(d.candles);if(isInitialLoad){chart.timeScale().fitContent();isInitialLoad=false;}drawSMCStructure(d);}
}
function drawSMCStructure(data){
  if(!candleSeries) return;
  activePriceLines.forEach(l=>{try{candleSeries.removePriceLine(l);}catch{}});activePriceLines=[];
  let showBOS=document.getElementById('toggle-bos').checked,showLiq=document.getElementById('toggle-liq').checked;
  // === ONLY SMC LINES - NO ENTRY/SL/TP ===
  (data.lines||[]).forEach(l=>{
    if((l.layer==='structure'&&!showBOS)||(l.layer==='liquidity'&&!showLiq)) return;
    let pl=candleSeries.createPriceLine({price:l.price,color:l.color,lineWidth:1,lineStyle:l.lineStyle||0,axisLabelVisible:true,title:l.title});
    activePriceLines.push(pl);
  });
  let filtered=(data.markers||[]).filter(m=>{if(m.label?.includes('BOS')||m.label?.includes('CHoCH')) return showBOS;if(m.label?.includes('SWEEP')) return showLiq;return true;});
  candleSeries.setMarkers(filtered);
  requestAnimationFrame(renderSMCZonesCanvas);
}
function renderSMCZonesCanvas(){
  if(!currentData||!chart||!candleSeries) return;
  let canvas=document.getElementById('drawCanvas');let ctx=canvas.getContext('2d');canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;ctx.clearRect(0,0,canvas.width,canvas.height);
  let showOB=document.getElementById('toggle-ob').checked,showFVG=document.getElementById('toggle-fvg').checked,showPD=document.getElementById('toggle-pd').checked,data=currentData;
  if(showPD&&data.pd_zones){
    let pd=data.pd_zones,highY=candleSeries.priceToCoordinate(pd.swing_high),eqY=candleSeries.priceToCoordinate(pd.equilibrium),lowY=candleSeries.priceToCoordinate(pd.swing_low);
    if(highY!==null&&eqY!==null&&lowY!==null){ctx.fillStyle="rgba(239,68,68,0.05)";ctx.fillRect(0,Math.min(highY,eqY),canvas.width,Math.abs(eqY-highY));ctx.fillStyle="rgba(34,197,94,0.05)";ctx.fillRect(0,Math.min(eqY,lowY),canvas.width,Math.abs(eqY-lowY));ctx.strokeStyle="rgba(250,204,21,0.4)";ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,eqY);ctx.lineTo(canvas.width,eqY);ctx.stroke();ctx.setLineDash([]);ctx.font="bold 10px monospace";let t=`Equilibrium ($${pd.equilibrium})`,m=ctx.measureText(t),bw=m.width+16,bh=18,bx=canvas.width-bw-65,by=eqY-9;ctx.fillStyle="#111119";ctx.fillRect(bx,by,bw,bh);ctx.strokeStyle="rgba(250,204,21,0.3)";ctx.strokeRect(bx,by,bw,bh);ctx.fillStyle="#facc15";ctx.fillText(t,bx+8,by+12.5);}
  }
  (data.zones||[]).forEach(zone=>{
    if(zone.layer==='ob'&&!showOB) return;if(zone.layer==='fvg'&&!showFVG) return;
    let topY=candleSeries.priceToCoordinate(zone.top),botY=candleSeries.priceToCoordinate(zone.bottom),startX=chart.timeScale().timeToCoordinate(zone.timeStart);
    if(topY!==null&&botY!==null&&startX!==null&&!isNaN(topY)&&!isNaN(botY)){let h=Math.abs(botY-topY),y=Math.min(topY,botY),w=Math.max(canvas.width-startX,40);ctx.fillStyle=zone.color;ctx.fillRect(startX,y,w,h);ctx.strokeStyle=zone.borderColor;ctx.lineWidth=1;ctx.strokeRect(startX,y,w,h);ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.fillText(zone.label,startX+6,y+14);}
  });
}
async function updateRealtimeTick(){
  if(!candleSeries||!currentData?.candles||isGoldMarketClosedNow()) return;
  try{let r=await fetch(`/api/price?tf=${currentTF}`);let t=await r.json();if(t.market_open===false||!t.price) return;let last=currentData.candles[currentData.candles.length-1];candleSeries.update({time:last.time,open:last.open,high:Math.max(last.high,t.price),low:Math.min(last.low,t.price),close:t.price});}catch{}
}
updateMarketSessionsAndClock();loadNewsEvents();loadChartHistory();setInterval(updateRealtimeTick,1000);setInterval(loadChartHistory,30000);
</script>
</body>
</html>
